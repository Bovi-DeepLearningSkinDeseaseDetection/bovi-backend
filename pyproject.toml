[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bovi-backend"
version = "0.1.0"
description = "Backend de Bovi: autenticación del ganadero, sincronización y restauración de evaluaciones."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.2,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: necesita una base de datos PostgreSQL (docker compose up -d db)",
]

[tool.coverage.run]
source = ["bovi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
