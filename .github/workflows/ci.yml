name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bovi
          POSTGRES_PASSWORD: bovi
          POSTGRES_DB: bovi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bovi -d bovi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bovi:bovi@localhost:5432/bovi_test
      TEST_DATABASE_URL: postgresql+psycopg://bovi:bovi@localhost:5432/bovi_test
      JWT_SECRET: secreto-de-ci-con-mas-de-32-caracteres-123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests migrations
          ruff format --check src tests migrations

      - name: Migraciones
        run: alembic upgrade head

      - name: Pruebas
        run: pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t bovi-backend:ci .
